name: 山大通知日报

on:
  schedule:
    # 2026-10-13 定案：不依赖第三方定时器（cron-job.org 的注册被其风控拦住，走不通）。
    # GitHub 自带 schedule 实测**会跑、但延迟 4–6 小时**，所以把班车排在**凌晨**，
    # 让「延迟之后」正好落在早上 7–9 点。脚本带 --skip-if-delivered：
    # 当天哪一班先成功投递，后面的班次整体跳过，不会重复发。
    - cron: "0 18 * * *"     # UTC 18:00 = 北京 02:00（+4~6h ≈ 早上 06–08 点）
    - cron: "0 20 * * *"     # UTC 20:00 = 北京 04:00（+4~6h ≈ 早上 08–10 点）
    - cron: "30 23 * * *"    # UTC 23:30 = 北京 07:30（万一它准点了，就是正点那班）
    - cron: "0 4 * * *"      # UTC 04:00 = 北京 12:00（当天最后兜底）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 抓取并发送日报
        env:
          # 这四项不是密钥，直接写在这里；只有授权码走 Secrets（只需配一个 SMTP_PASS）
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: "465"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          # GITHUB_TOKEN 不会自动出现在环境里，必须显式传，否则脚本发不出通知
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 只走邮件一条通道：issue 的内容与邮件完全重复，每天再建一条 issue
        # 只会让他收到两封一样的邮件。去掉 --issue 即关闭该通道；
        # 漏发兜底仍由本机 SDU-Cloud-Audit（每天 09:40 体检 + 补发）负责。
        run: python watch.py --send --skip-if-delivered

      - name: 提交状态文件
        if: always()
        run: |
          git config user.name "sdu-watch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "state: $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
