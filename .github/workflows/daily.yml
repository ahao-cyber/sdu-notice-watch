name: 山大通知日报

on:
  schedule:
    # ⚠️ GitHub 的定时**不保证准点**：2026-10-13 实测延迟 4–6 小时
    #   （cron 写 UTC 23:30 = 北京 07:30 → 实际 11:45 才跑；08:35 那班 → 实际 15:02）
    # 对策＝把班车往前排，让「延迟之后」落在早上。脚本带 --skip-if-delivered，
    # 当天哪一班先成功投递，后面的班次整体跳过，不会重复发。
    - cron: "0 19 * * *"     # UTC 19:00 = 北京 03:00（+延迟 ≈ 早上 07–09 点送达）
    - cron: "0 21 * * *"     # UTC 21:00 = 北京 05:00（+延迟 ≈ 上午 09–11 点送达）
    - cron: "30 23 * * *"    # UTC 23:30 = 北京 07:30（原主班车）
    - cron: "35 0 * * *"     # UTC 00:35 = 北京 08:35（原兜底班）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 抓取并发送日报
        env:
          # 这四项不是密钥，直接写在这里；只有授权码走 Secrets（只需配一个 SMTP_PASS）
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: "465"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          # GITHUB_TOKEN 不会自动出现在环境里，必须显式传，否则脚本发不出通知
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python watch.py --send --issue --skip-if-delivered

      - name: 提交状态文件
        if: always()
        run: |
          git config user.name "sdu-watch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "state: $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
